<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تقدیم با عشق</title>

    <!-- ===== رنگ نوار آدرس ===== -->
    <meta name="theme-color" content="#00ff88">
    <meta name="msapplication-navbutton-color" content="#00ff88">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* ===== تنظیمات کلی ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        /* ===== پس‌زمینه شطرنجی (مشکی + سبز نئونی) ===== */
        .checkerboard-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(45deg, rgba(57, 255, 20, 0.06) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(57, 255, 20, 0.06) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(57, 255, 20, 0.06) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(57, 255, 20, 0.06) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }

        .checkerboard-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, rgba(57, 255, 20, 0.03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(57, 255, 20, 0.03) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(57, 255, 20, 0.03) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(57, 255, 20, 0.03) 75%);
            background-size: 120px 120px;
            background-position: 0 0, 0 60px, 60px -60px, -60px 0px;
            pointer-events: none;
        }

        .checkerboard-bg .glow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(57, 255, 20, 0.04) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
        }

        /* ===== هر بخش ===== */
        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* ===== کادر شیشه‌ای ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-radius: 34px;
            padding: 44px 38px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .section.visible .glass-card {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== استایل متن‌ها ===== */
        .glass-card h1 {
            font-size: 52px;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 50px rgba(57, 255, 20, 0.12);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .glass-card p {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 12px;
            line-height: 1.6;
            font-weight: 400;
        }

        .point-down { 
            font-size: 56px; 
            display: block; 
            margin-top: 12px; 
            animation: bouncePoint 1.8s ease-in-out infinite; 
        }

        /* ===== استایل استیکر ===== */
        .sticker-wrapper {
            width: 100%;
            max-width: 360px;
            border-radius: 22px;
            overflow: hidden;
            margin: 16px auto 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .sticker-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .sticker-sub {
            color: rgba(57, 255, 20, 0.4);
            margin-top: 16px;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* ===== فلش پایین ===== */
        .arrow-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: #39ff14;
            animation: bounceArrow 2s ease-in-out infinite;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }

        .arrow-down:active {
            opacity: 1;
            transform: translateX(-50%) scale(0.9);
        }

        @keyframes bounceArrow {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(12px);
            }
        }

        /* ===== بخش سوم ===== */
        .section-prize .glass-card {
            padding: 38px 32px 32px;
        }

        .section-prize h2 {
            font-size: 42px;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 50px rgba(57, 255, 20, 0.10);
            letter-spacing: -0.5px;
        }

        .section-prize .prize-text {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 8px;
            font-weight: 400;
        }

        .section-prize .point-down {
            font-size: 56px;
            display: block;
            margin-top: 12px;
            animation: bouncePoint 1.8s ease-in-out infinite;
        }

        @keyframes bouncePoint {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(10px);
            }
        }

        /* ===== بخش چهارم ===== */
        .section-gif .glass-card {
            padding: 32px 28px 36px;
        }

        .section-gif h2 {
            font-size: 32px;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 50px rgba(57, 255, 20, 0.10);
            margin-bottom: 18px;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 32px 24px;
                border-radius: 28px;
            }
            .glass-card h1 {
                font-size: 40px;
            }
            .glass-card p {
                font-size: 20px;
            }
            .section-prize h2 {
                font-size: 34px;
            }
            .section-prize .prize-text {
                font-size: 20px;
            }
            .section-prize .point-down {
                font-size: 44px;
            }
            .section-gif h2 {
                font-size: 26px;
            }
            .sticker-wrapper {
                max-width: 280px;
                border-radius: 18px;
            }
            .arrow-down {
                font-size: 30px;
                bottom: 25px;
            }
            .sticker-sub {
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .glass-card {
                padding: 26px 18px;
                border-radius: 24px;
            }
            .glass-card h1 {
                font-size: 32px;
            }
            .glass-card p {
                font-size: 17px;
            }
            .section-prize h2 {
                font-size: 28px;
            }
            .section-prize .prize-text {
                font-size: 17px;
            }
            .section-prize .point-down {
                font-size: 38px;
            }
            .section-gif h2 {
                font-size: 22px;
            }
            .sticker-wrapper {
                max-width: 220px;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه شطرنجی ===== -->
    <div class="checkerboard-bg">
        <div class="glow-center"></div>
    </div>

    <!-- ===== بخش اول ===== -->
    <section class="section" id="section1">
        <div class="glass-card">
            <h1>بیا پایین</h1>
            <div class="sticker-wrapper">
                <img src="sticker.gif" alt="استیکر">
            </div>
            <p class="sticker-sub">تقدیم با عشق</p>
            <span class="point-down">👇</span>
        </div>
        <div class="arrow-down" onclick="scrollToSection('section2')">↓</div>
    </section>

    <!-- ===== بخش دوم ===== -->
    <section class="section" id="section2">
        <div class="glass-card">
            <h1>بازم پایین‌تر</h1>
        </div>
        <div class="arrow-down" onclick="scrollToSection('section3')">↓</div>
    </section>

    <!-- ===== بخش سوم ===== -->
    <section class="section section-prize" id="section3">
        <div class="glass-card">
            <h2>رسیدی</h2>
            <p class="prize-text">جایزت این پایینه</p>
            <span class="point-down">👇</span>
        </div>
        <div class="arrow-down" onclick="scrollToSection('section4')">↓</div>
    </section>

    <!-- ===== بخش چهارم ===== -->
    <section class="section section-gif" id="section4">
        <div class="glass-card">
            <h2>🎁</h2>
            <div class="sticker-wrapper">
                <img src="sticker.gif" alt="استیکر">
            </div>
            <p class="sticker-sub">تقدیم با عشق</p>
        </div>
    </section>

    <!-- ===== اسکریپت ===== -->
    <script>
        const sections = document.querySelectorAll('.section');

        function checkVisibility() {
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const threshold = windowHeight * 0.78;

                if (rect.top < threshold) {
                    section.classList.add('visible');
                }
            });
        }

        window.addEventListener('scroll', checkVisibility);
        window.addEventListener('load', checkVisibility);
        window.addEventListener('touchmove', checkVisibility);

        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        document.querySelectorAll('.arrow-down').forEach(arrow => {
            arrow.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const target = this.getAttribute('onclick').match(/'([^']+)'/)[1];
                scrollToSection(target);
            });
        });

        console.log('😏 پس‌زمینه شطرنجی + گیف!');
    </script>

</body>
</html>
