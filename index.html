<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شوخی</title>

    <!-- ===== رنگ نوار آدرس کروم (گوشی) ===== -->
    <meta name="theme-color" content="#00ff88">
    <meta name="msapplication-navbutton-color" content="#00ff88">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* ===== تنظیمات کلی ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #fff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== کانواس انیمیشن (پس‌زمینه) ===== */
        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== هر بخش ===== */
        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* ===== کادر شیشه‌ای مثل آیفون ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-radius: 34px;
            padding: 44px 38px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            
            /* ===== انیمیشن محو ===== */
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .section.visible .glass-card {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== استایل متن‌ها ===== */
        .glass-card h1 {
            font-size: 52px;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 50px rgba(57, 255, 20, 0.15);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .glass-card p {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 12px;
            line-height: 1.6;
            font-weight: 400;
        }

        /* ===== فلش پایین ===== */
        .arrow-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: #39ff14;
            animation: bounceArrow 2s ease-in-out infinite;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }

        .arrow-down:active {
            opacity: 1;
            transform: translateX(-50%) scale(0.9);
        }

        @keyframes bounceArrow {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(12px);
            }
        }

        /* ===== بخش سوم: رسیدی + جایزت این پایینه ===== */
        .section-prize .glass-card {
            padding: 38px 32px 32px;
        }

        .section-prize h2 {
            font-size: 42px;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 50px rgba(57, 255, 20, 0.12);
            letter-spacing: -0.5px;
        }

        .section-prize .prize-text {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            font-weight: 400;
        }

        .section-prize .point-down {
            font-size: 56px;
            display: block;
            margin-top: 12px;
            animation: bouncePoint 1.8s ease-in-out infinite;
        }

        @keyframes bouncePoint {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(10px);
            }
        }

        /* ===== بخش چهارم: گیف ===== */
        .section-gif .glass-card {
            padding: 32px 28px 36px;
        }

        .section-gif h2 {
            font-size: 32px;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 50px rgba(57, 255, 20, 0.12);
            margin-bottom: 18px;
        }

        .gif-wrapper {
            width: 100%;
            max-width: 360px;
            border-radius: 22px;
            overflow: hidden;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .gif-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .section-gif .sub-gif {
            color: rgb(0, 255, 21);
            margin-top: 16px;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 300;
            font-weight: 400;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 32px 24px;
                border-radius: 28px;
            }
            .glass-card h1 {
                font-size: 40px;
            }
            .glass-card p {
                font-size: 20px;
            }
            .section-prize h2 {
                font-size: 34px;
            }
            .section-prize .prize-text {
                font-size: 20px;
            }
            .section-prize .point-down {
                font-size: 44px;
            }
            .section-gif h2 {
                font-size: 26px;
            }
            .gif-wrapper {
                max-width: 280px;
                border-radius: 18px;
            }
            .arrow-down {
                font-size: 30px;
                bottom: 25px;
            }
            .section-gif .sub-gif {
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .glass-card {
                padding: 26px 18px;
                border-radius: 24px;
            }
            .glass-card h1 {
                font-size: 32px;
            }
            .glass-card p {
                font-size: 17px;
            }
            .section-prize h2 {
                font-size: 28px;
            }
            .section-prize .prize-text {
                font-size: 17px;
            }
            .section-prize .point-down {
                font-size: 38px;
            }
            .section-gif h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== کانواس انیمیشن شبکه نئونی (پس‌زمینه) ===== -->
    <canvas id="networkCanvas"></canvas>

    <!-- ===== بخش اول: بیا پایین ===== -->
    <section class="section" id="section1">
        <div class="glass-card">
            <h1>بیا پایین</h1>
        </div>
        <div class="arrow-down" onclick="scrollToSection('section2')">↓</div>
    </section>

    <!-- ===== بخش دوم: بازم پایین‌تر ===== -->
    <section class="section" id="section2">
        <div class="glass-card">
            <h1>بازم پایین‌تر</h1>
        </div>
        <div class="arrow-down" onclick="scrollToSection('section3')">↓</div>
    </section>

    <!-- ===== بخش سوم: رسیدی + جایزت این پایینه + استیکر دست ===== -->
    <section class="section section-prize" id="section3">
        <div class="glass-card">
            <h2>رسیدی</h2>
            <p class="prize-text">جایزت این پایینه</p>
            <span class="point-down">👇</span>
        </div>
        <div class="arrow-down" onclick="scrollToSection('section4')">↓</div>
    </section>

    <!-- ===== بخش چهارم: گیف ===== -->
    <section class="section section-gif" id="section4">
        <div class="glass-card">
            <h2>🎁</h2>
            <div class="gif-wrapper">
                <!-- ===== گیف خودت رو بزار ===== -->
                <img src="sticker.gif" alt="گیف">
            </div>
            <p class="sub-gif">تقدیم با عشق</p>
        </div>
    </section>

    <!-- ===== اسکریپت انیمیشن خودکار (بدون تاثیر موس) ===== -->
    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ===== حرکت مستقل و خودکار گره‌ها =====
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // سرعت‌های متفاوت برای حرکت‌های نامنظم
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 2.5 + 1.5;
                // برای تغییرات ناگهانی جهت
                this.directionChange = Math.random() * 200 + 100;
                this.frame = 0;
            }

            update() {
                this.frame++;

                // ===== تغییر ناگهانی جهت برای حرکت‌های نامنظم =====
                if (this.frame > this.directionChange) {
                    this.vx += (Math.random() - 0.5) * 0.2;
                    this.vy += (Math.random() - 0.5) * 0.2;
                    // محدود کردن سرعت
                    const maxSpeed = 0.8;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }
                    this.directionChange = Math.random() * 200 + 100;
                    this.frame = 0;
                }

                this.x += this.vx;
                this.y += this.vy;

                // ===== بازگشت از لبه‌ها =====
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#39ff14';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        const particles = [];
        const particleCount = 120;

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ===== رسم خطوط بین گره‌ها =====
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        let opacityValue = 1 - (distance / 150);
                        ctx.strokeStyle = `rgba(57, 255, 20, ${opacityValue * 0.9})`;
                        ctx.lineWidth = 1.2;
                        ctx.shadowColor = '#39ff14';
                        ctx.shadowBlur = 4;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // ===== رسم گره‌ها =====
            for (let particle of particles) {
                particle.update();
                particle.draw();
            }
        }

        animate();

        // ===== نمایش بخش‌ها هنگام اسکرول =====
        const sections = document.querySelectorAll('.section');

        function checkVisibility() {
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const threshold = windowHeight * 0.78;

                if (rect.top < threshold) {
                    section.classList.add('visible');
                }
            });
        }

        window.addEventListener('scroll', checkVisibility);
        window.addEventListener('load', checkVisibility);
        window.addEventListener('touchmove', checkVisibility);

        // ===== اسکرول آروم =====
        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        document.querySelectorAll('.arrow-down').forEach(arrow => {
            arrow.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const target = this.getAttribute('onclick').match(/'([^']+)'/)[1];
                scrollToSection(target);
            });
        });

        console.log('😏 انیمیشن خودکار بدون تاثیر موس!');
    </script>

</body>
</html>
