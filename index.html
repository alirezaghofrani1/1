<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عشق من</title>

    <!-- ===== فونت نستعلیق ===== -->
    <link href="https://cdn.fontcdn.ir/Font/Persian/VazirMatn/VazirMatn.css" rel="stylesheet">
    <style>
        /* ===== تنظیمات کلی ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VazirMatn', 'IranNastaliq', 'Nastaliq', 'Noto Naskh Arabic', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #2d1b2e, #1a0f1a);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== بارش قلب‌ها ===== */
        .hearts-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-drop {
            position: absolute;
            top: -50px;
            color: rgba(255, 100, 140, 0.35);
            font-size: 24px;
            user-select: none;
            animation: heartFall linear infinite;
        }

        .heart-drop:nth-child(1) { left: 5%; font-size: 18px; animation-duration: 8s; animation-delay: 0s; opacity: 0.3; }
        .heart-drop:nth-child(2) { left: 12%; font-size: 28px; animation-duration: 10s; animation-delay: 1s; opacity: 0.4; }
        .heart-drop:nth-child(3) { left: 20%; font-size: 16px; animation-duration: 7s; animation-delay: 2s; opacity: 0.35; }
        .heart-drop:nth-child(4) { left: 28%; font-size: 32px; animation-duration: 11s; animation-delay: 0.5s; opacity: 0.25; }
        .heart-drop:nth-child(5) { left: 35%; font-size: 20px; animation-duration: 9s; animation-delay: 3s; opacity: 0.4; }
        .heart-drop:nth-child(6) { left: 42%; font-size: 26px; animation-duration: 8.5s; animation-delay: 1.5s; opacity: 0.3; }
        .heart-drop:nth-child(7) { left: 50%; font-size: 15px; animation-duration: 7.5s; animation-delay: 4s; opacity: 0.45; }
        .heart-drop:nth-child(8) { left: 58%; font-size: 34px; animation-duration: 12s; animation-delay: 0.8s; opacity: 0.2; }
        .heart-drop:nth-child(9) { left: 65%; font-size: 22px; animation-duration: 9.5s; animation-delay: 2.5s; opacity: 0.35; }
        .heart-drop:nth-child(10) { left: 72%; font-size: 18px; animation-duration: 8s; animation-delay: 3.5s; opacity: 0.4; }
        .heart-drop:nth-child(11) { left: 78%; font-size: 30px; animation-duration: 10.5s; animation-delay: 1.2s; opacity: 0.25; }
        .heart-drop:nth-child(12) { left: 85%; font-size: 16px; animation-duration: 7s; animation-delay: 4.5s; opacity: 0.4; }
        .heart-drop:nth-child(13) { left: 92%; font-size: 26px; animation-duration: 9s; animation-delay: 2s; opacity: 0.3; }
        .heart-drop:nth-child(14) { left: 48%; font-size: 20px; animation-duration: 8.8s; animation-delay: 5s; opacity: 0.35; }
        .heart-drop:nth-child(15) { left: 15%; font-size: 14px; animation-duration: 6.5s; animation-delay: 3.8s; opacity: 0.5; }
        .heart-drop:nth-child(16) { left: 62%; font-size: 36px; animation-duration: 13s; animation-delay: 0.3s; opacity: 0.15; }
        .heart-drop:nth-child(17) { left: 88%; font-size: 22px; animation-duration: 9.2s; animation-delay: 4.2s; opacity: 0.3; }
        .heart-drop:nth-child(18) { left: 32%; font-size: 28px; animation-duration: 10.8s; animation-delay: 1.8s; opacity: 0.25; }
        .heart-drop:nth-child(19) { left: 55%; font-size: 16px; animation-duration: 7.2s; animation-delay: 5.5s; opacity: 0.4; }
        .heart-drop:nth-child(20) { left: 75%; font-size: 30px; animation-duration: 11.5s; animation-delay: 2.2s; opacity: 0.2; }

        @keyframes heartFall {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 50px)) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        /* ===== کارت اصلی با انیمیشن آروم ===== */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            padding: 25px 25px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 200, 220, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            
            /* ===== انیمیشن آروم کل صفحه ===== */
            opacity: 0;
            animation: pageFadeIn 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes pageFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== کادر عکس با انیمیشن آروم از پایین ===== */
        .image-wrapper {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1/1;
            border-radius: 24px;
            overflow: hidden;
            margin: 0 auto;
            background: linear-gradient(145deg, #3d1f33, #251525);
            border: 2px solid rgba(255, 200, 220, 0.12);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            
            /* ===== انیمیشن آروم از پایین ===== */
            opacity: 0;
            transform: translateY(60px);
            animation: imageSlideUp 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 0.3s;
        }

        @keyframes imageSlideUp {
            0% {
                opacity: 0;
                transform: translateY(60px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .image-wrapper:hover img {
            transform: scale(1.04);
        }

        /* ===== متن عاشقانه با فونت نستعلیق ===== */
        .love-text {
            margin-top: 22px;
            padding: 0 5px;
            opacity: 0;
            transform: translateY(20px);
            animation: textSlideUp 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 0.7s;
        }

        @keyframes textSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .love-text p {
            font-family: 'VazirMatn', 'IranNastaliq', 'Nastaliq', serif;
            font-size: 20px;
            font-weight: 400;
            color: #fce4ec;
            line-height: 2.2;
            text-shadow: 0 2px 30px rgba(255, 80, 120, 0.15);
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffb3c6, #ff6b8a, #ffb3c6);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 5s ease-in-out infinite;
        }

        @keyframes shimmerText {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* ===== سه قلب زیر متن ===== */
        .hearts-row {
            margin-top: 14px;
            font-size: 24px;
            letter-spacing: 10px;
            opacity: 0;
            animation: heartPop 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 1.1s;
        }

        @keyframes heartPop {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            60% {
                transform: scale(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hearts-row span {
            display: inline-block;
            animation: heartBeat 2s ease-in-out infinite;
        }

        .hearts-row span:nth-child(1) { animation-delay: 0s; }
        .hearts-row span:nth-child(2) { animation-delay: 0.4s; }
        .hearts-row span:nth-child(3) { animation-delay: 0.8s; }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 480px) {
            .card {
                padding: 18px 15px 22px;
                border-radius: 24px;
            }
            .image-wrapper {
                border-radius: 18px;
            }
            .love-text p {
                font-size: 17px;
                line-height: 2;
            }
            .hearts-row {
                font-size: 20px;
                letter-spacing: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== بارش قلب‌ها ===== -->
    <div class="hearts-rain">
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
        <span class="heart-drop">♥</span>
    </div>

    <!-- ===== کارت اصلی ===== -->
    <div class="card">

        <!-- ===== کادر عکس ===== -->
        <div class="image-wrapper">
            <img src="1.jpg" alt="عشق من">
        </div>

        <!-- ===== متن عاشقانه با فونت نستعلیق ===== -->
        <div class="love-text">
            <p>
                تو بهترین اتفاق زندگی‌ام هستی ❤️<br>
                هر لحظه با تو، یک خاطره‌ی زیباست
            </p>
        </div>

        <!-- ===== سه قلب ===== -->
        <div class="hearts-row">
            <span>♥</span>
            <span>♥</span>
            <span>♥</span>
        </div>

    </div>

</body>
</html>
